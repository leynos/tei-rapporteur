[build-system]
requires = ["maturin==1.14.1"]
build-backend = "maturin"

[project]
name = "tei-rapporteur"
version = "0.1.0"
description = "PyO3 bindings for the TEI Rapporteur toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "ISC" }
authors = [{ name = "Payton McIntosh", email = "pmcintosh@df12.net" }]
dependencies = [
    "msgspec>=0.19,<0.20",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Rust",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "License :: OSI Approved :: ISC License (ISCL)",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0",
    # Keep in sync with .github/workflows/ci.yml.
    "maturin==1.14.1",
    "pyyaml>=6",
]

[tool.maturin]
manifest-path = "tei-py/Cargo.toml"
module-name = "tei_rapporteur"
python-source = "python"
bindings = "pyo3"
strip = true
no-default-features = true
features = ["extension-module"]

[tool.maturin.env]
TEI_PY_BUILD_EXTENSION = "1"

[tool.pytest.ini_options]
testpaths = ["python/tests", "tests"]
