name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@455d9ed03477c0026da96c2541ca26569a74acac
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
      - name: Lint
        run: make lint
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@455d9ed03477c0026da96c2541ca26569a74acac
        with:
          output-path: coverage.xml
          format: cobertura
      - name: Install jing for XML validation
        run: sudo apt-get update && sudo apt-get install -y jing
      - name: Validate XML fixtures against Relax NG schema
        run: make validate-xml
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@1e862dfacbd1d6d858c55d9b792c756523627244  # v7.1.4
      - name: Install maturin
        env:
          # Keep in sync with pyproject.toml.
          MATURIN_VERSION: "1.13.3"
        run: python -m pip install --upgrade pip "maturin==${MATURIN_VERSION}"
      - name: Build Python wheel
        shell: bash
        env:
          TEI_PY_BUILD_EXTENSION: "1"
        run: |
          set -euo pipefail
          rm -f dist/tei_rapporteur-*.whl
          maturin build --release --manifest-path tei-py/Cargo.toml --out dist
          shopt -s nullglob
          wheels=(dist/tei_rapporteur-*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
              echo "Expected exactly one tei_rapporteur wheel, found ${#wheels[@]}" >&2
              ls dist
              exit 1
          fi
          echo "WHEEL_PATH=${wheels[0]}" >> "$GITHUB_ENV"
      - name: Install Python wheel
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WHEEL_PATH:-}" ]]; then
              echo "WHEEL_PATH is unset; ensure the build step exported it" >&2
              exit 1
          fi
          if [[ ! -f "$WHEEL_PATH" ]]; then
              echo "Wheel path $WHEEL_PATH does not exist" >&2
              ls dist
              exit 1
          fi
          python -m pip install "$WHEEL_PATH"
      - name: Smoke test tei_rapporteur module
        run: |
          python -c "import tei_rapporteur as tr; print(f'Version: {tr.__version__}'); assert hasattr(tr, 'Document'), 'Document class not exported'; assert hasattr(tr, 'emit_title_markup'), 'emit_title_markup missing'"
          echo "SMOKE_TEST_PASSED"
      - name: Upload coverage data to CodeScene
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: ${{ env.CS_ACCESS_TOKEN }}
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@455d9ed03477c0026da96c2541ca26569a74acac
        with:
          format: cobertura
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
