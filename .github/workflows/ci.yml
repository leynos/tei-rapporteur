name: CI

'on':
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
      BUILD_PROFILE: debug
      WHITAKER_INSTALLER_VERSION: '0.2.6'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - name: Setup Rust
        uses: leynos/shared-actions/.github/actions/setup-rust@18bed1ca49a6de3d8882bd72635a32ae3f023d57
      - name: Format
        run: make check-fmt
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@ded1f9488f68a970bc66ea5619e13e9b52e601cd
        with:
          globs: |
            **/*.md
            !**/target/**
            !**/dist/**
            !**/.uv-cache/**
            !**/.uv-tools/**
      - name: Cache whitaker-installer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/bin/whitaker-installer
            ~/.cache/cargo-binstall
          key: whitaker-installer-${{ runner.os }}-${{ runner.arch }}-${{ env.WHITAKER_INSTALLER_VERSION }}
      - name: Install Whitaker Dylint suite
        run: |
          if ! command -v whitaker-installer >/dev/null 2>&1; then
            if cargo binstall --version >/dev/null 2>&1; then
              cargo binstall --no-confirm --locked "whitaker-installer@${WHITAKER_INSTALLER_VERSION}"
            else
              echo "cargo-binstall unavailable; building whitaker-installer from crates.io"
              cargo install --locked whitaker-installer --version "${WHITAKER_INSTALLER_VERSION}"
            fi
          fi
          whitaker-installer
      - name: Lint
        run: make lint
      # `cargo llvm-cov nextest` below does not execute doctests, so they are
      # run here or they rot unnoticed.
      - name: Doc tests
        run: make test-doc
      - name: Test and Measure Coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@18bed1ca49a6de3d8882bd72635a32ae3f023d57
        with:
          # The shared action detects this repository as a mixed
          # Rust-and-Python project (root Cargo.toml plus root
          # pyproject.toml), and mixed projects only support the merged
          # cobertura format.
          output-path: coverage.xml
          format: cobertura
          with-ratchet: 'true'
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: github.event_name == 'pull_request' && env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@074f7d8ba75a6e5d18532b72cbe38fccbda4e9c6
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/72456
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
      - name: Install jing for XML validation
        run: sudo apt-get update && sudo apt-get install -y jing
      - name: Validate XML fixtures against Relax NG schema
        run: make validate-xml
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2
      - name: Workflow contract tests
        run: make test-workflow-contracts
      - name: Install maturin
        env:
          # Keep in sync with pyproject.toml.
          MATURIN_VERSION: "1.13.3"
        run: python -m pip install --upgrade pip "maturin==${MATURIN_VERSION}"
      - name: Run maturin compatibility tests
        run: uv run --group dev pytest python/tests/test_maturin_build.py -q
      - name: Build Python wheel
        shell: bash
        env:
          TEI_PY_BUILD_EXTENSION: "1"
        run: |
          set -euo pipefail
          rm -f dist/tei_rapporteur-*.whl
          maturin build --release --manifest-path tei-py/Cargo.toml --out dist
          shopt -s nullglob
          wheels=(dist/tei_rapporteur-*.whl)
          if [[ ${#wheels[@]} -ne 1 ]]; then
              echo "Expected exactly one tei_rapporteur wheel, found ${#wheels[@]}" >&2
              ls dist
              exit 1
          fi
          echo "WHEEL_PATH=${wheels[0]}" >> "$GITHUB_ENV"
      - name: Install Python wheel
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${WHEEL_PATH:-}" ]]; then
              echo "WHEEL_PATH is unset; ensure the build step exported it" >&2
              exit 1
          fi
          if [[ ! -f "$WHEEL_PATH" ]]; then
              echo "Wheel path $WHEEL_PATH does not exist" >&2
              ls dist
              exit 1
          fi
          python -m pip install "$WHEEL_PATH"
      - name: Smoke test tei_rapporteur module
        run: |
          python -c "import tei_rapporteur as tr; print(f'Version: {tr.__version__}'); assert hasattr(tr, 'Document'), 'Document class not exported'; assert hasattr(tr, 'emit_title_markup'), 'emit_title_markup missing'"
          echo "SMOKE_TEST_PASSED"
      - name: Set up Python for spelling and Mermaid tooling
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'
      - name: Install uv for spelling and Mermaid tooling
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Enforce en-GB-oxendict spelling
        run: make spelling
      - name: Set up Rust for Merman
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # master
        with:
          toolchain: '1.95.0'
      - name: Install Mermaid validation tools
        run: |
          uv tool install nixie-cli==1.1.0
          cargo +1.95.0 install merman-cli --version '=0.7.0' --locked
      - name: Validate Mermaid diagrams
        run: make nixie
