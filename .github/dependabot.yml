version: 2

# maturin (uv) and PyO3 (Cargo) are versioned independently yet build one
# extension, so an update to either alone cannot be built against the other.
# Joining both to this group puts the available updates for the pair into one
# pull request, so when both have one a single CI run builds them together. It
# does not hold back a bump when only one of the two has an update, and a group
# cannot choose compatible versions.
#
# Dependabot builds one job per entry, and an entry that joins a group runs only
# that group, over the dependencies its `patterns` take: its own groups, ignore
# rules and every other dependency are not processed (cuprum's first run of this
# arrangement showed exactly that). So the `cargo` and `uv` ecosystems each have
# two entries: the group entry, listed first, for the pair; and the plain entry,
# the stanza as it was apart from an `ignore` of the pair so that the pair is
# handled once, for everything else.
multi-ecosystem-groups:
  maturin-pyo3:
    # Dependabot rejects `open-pull-requests-limit` on an entry that joins a
    # multi-ecosystem group: the bound belongs to the group.
    open-pull-requests-limit: 5
    schedule:
      interval: "daily"

updates:
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    groups:
      shared-actions:
        patterns:
          - 'leynos/shared-actions*'
      github-actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'
    directory: "/"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7

  # The pair, and what releases with it: pyo3, its build-time config crate and the
  # serde-pyobject bridge (renamed pyo3-serde in tei-py/Cargo.toml; Dependabot
  # matches the published name) share PyO3 types and release against one PyO3
  # generation, so one bumped alone breaks the others.
  - package-ecosystem: "cargo"
    directory: "/"
    multi-ecosystem-group: "maturin-pyo3"
    patterns:
      - "pyo3"
      - "pyo3-build-config"
      - "serde-pyobject"
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # The pair: the Python build backend joins the maturin-pyo3 group.
  - package-ecosystem: "uv"
    directory: "/"
    multi-ecosystem-group: "maturin-pyo3"
    patterns:
      - "maturin"
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for Cargo. The pyo3 family is handled by the group
  # entry above, so it is ignored here.
  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      # The rstest-bdd crates release in lockstep and one bumped alone does not
      # build. Cargo counts a 0.x minor as a major, which the catch-all leaves
      # ungrouped, so this group keeps the family in one pull request. It must
      # precede the catch-all: Dependabot uses the first group that matches.
      rstest-bdd:
        patterns:
          - "rstest-bdd*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "pyo3"
      - dependency-name: "pyo3-build-config"
      - dependency-name: "serde-pyobject"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "cargo"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enable version updates for Python (uv). The pair is handled by the group
  # entry above, so it is ignored here.
  - package-ecosystem: "uv"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "maturin"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Keep the pinned Rust toolchain current (RT-024).
  - package-ecosystem: "rust-toolchain"
    directory: "/"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust-toolchain"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
