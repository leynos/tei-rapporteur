# Repository-specific machine literals, formal names and serialized fixture.

schema = 1

[oxford]
stems = []

[words]
accepted = []

[words.corrections]

[patterns]
ignore = [
  # Cargo and GitHub workflow values are machine interfaces.
  '(?m)^      CARGO_TERM_COLOR: always$',
  # Cargo's `--color` option, which the suite-once contract's reader skips.
  '(?m)^    \{"--config", "-Z", "-C", "--manifest-path", "--color", "--target-dir"\}$',
  '(?m)^    types: \[opened, reopened, synchronize, labeled, ready_for_review\]$',
  # Upstream API terminology and the exact serialized fixture stay unchanged.
  '(?m)^  documented model is a StAX-like streaming API for large documents; no new XML$',
  '(?m)^    "<div type=\\"labeled-list\\">",$',
  # Inline code spans are masked; the shared dictionary does not mask them yet.
  '`[^`\n]+`',
  # The external Linux linker name, in its flag, variable and input forms.
  "-Clink-arg=-fuse-ld=mold",
  "STANDARD_MOLD_FLAG",
  "install-mold",
  "sudo apt-get install mold",
]

[files]
exclude = [
  # Serialized ANSI review output is retained verbatim.
  "review.txt",
]
